[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-orcamento"
version = "1.0.0"
description = "Bot que lê e entende orçamentos, propõe cenários de adaptação e oportunidades de redução de custos, com relatório HTML revisado."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
ia = ["anthropic>=1.0"]
navegador = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
bot-orcamento = "bot_orcamento.cli:main"

[tool.setuptools.packages.find]
include = ["bot_orcamento*"]

[tool.setuptools.package-data]
bot_orcamento = ["relatorio/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/skills"]
addopts = "--import-mode=importlib -q"
pythonpath = ["."]
